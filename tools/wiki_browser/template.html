<title>CISA Domains Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky search bar over a two-column shell (domain nav left, entries right); nav becomes a scroll strip on phones.
   Palette and faces follow Sebastian's study planner (HSL triplets, Bricolage / Plex). */
:root {
  --bg: 210 22% 97%; --card: 0 0% 100%; --fg: 215 32% 13%; --muted: 210 20% 93%;
  --muted-fg: 215 14% 40%; --border: 212 18% 84%; --primary: 192 72% 27%;
  --ok: 150 55% 32%; --warn: 35 85% 38%; --bad: 4 70% 45%; --mark: 48 95% 80%;
  --d1: 192 72% 30%; --d2: 228 55% 48%; --d3: 88 40% 36%; --d4: 34 85% 44%; --d5: 8 62% 46%;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: .25rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: 215 30% 8%; --card: 215 26% 11%; --fg: 210 22% 91%; --muted: 215 22% 16%;
  --muted-fg: 212 14% 64%; --border: 215 18% 23%; --primary: 186 58% 56%;
  --ok: 150 45% 55%; --warn: 38 90% 62%; --bad: 4 70% 60%; --mark: 45 70% 30%;
  --d1: 186 58% 52%; --d2: 226 70% 70%; --d3: 88 40% 56%; --d4: 36 85% 58%; --d5: 8 70% 64%;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: 215 30% 8%; --card: 215 26% 11%; --fg: 210 22% 91%; --muted: 215 22% 16%;
  --muted-fg: 212 14% 64%; --border: 215 18% 23%; --primary: 186 58% 56%;
  --ok: 150 45% 55%; --warn: 38 90% 62%; --bad: 4 70% 60%; --mark: 45 70% 30%;
  --d1: 186 58% 52%; --d2: 226 70% 70%; --d3: 88 40% 56%; --d4: 36 85% 58%; --d5: 8 70% 64%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: hsl(var(--bg)); color: hsl(var(--fg)); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: hsl(var(--card)); }
a { color: hsl(var(--primary)); }
:focus-visible { outline: 2px solid hsl(var(--primary)); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 600; font-family: var(--f-body); }
p { margin: 0; }
mark { background: hsl(var(--mark)); color: inherit; border-radius: 2px; }
.eyebrow { font: 500 .72rem/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: hsl(var(--muted-fg)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: hsl(var(--muted-fg)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: hsl(var(--card)); border-bottom: 1px solid hsl(var(--border)); }
.bar-in { max-width: 1280px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.brand { font: 700 1.05rem/1 var(--f-display); white-space: nowrap; }
.brand small { font: 500 .7rem var(--f-mono); color: hsl(var(--muted-fg)); margin-left: 6px; letter-spacing: .04em; }
#q { flex: 1 1 260px; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid hsl(var(--border)); border-radius: var(--r); background: hsl(var(--bg)); color: hsl(var(--fg)); }
.selects { display: flex; flex-wrap: wrap; gap: 8px; }
select { font: inherit; font-size: .85rem; padding: 6px 8px; border: 1px solid hsl(var(--border)); border-radius: var(--r); background: hsl(var(--bg)); color: hsl(var(--fg)); max-width: 100%; }
.chips { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .78rem/1 var(--f-body); padding: 6px 9px; border-radius: 999px; border: 1px solid hsl(var(--border)); background: transparent; color: hsl(var(--fg)); cursor: pointer; }
.chip[aria-pressed="true"] { background: hsl(var(--fg)); color: hsl(var(--bg)); border-color: hsl(var(--fg)); }
.chip .n { font-family: var(--f-mono); opacity: .7; margin-left: 4px; }
.chip.reset { border-style: dashed; }

/* shell */
.shell { max-width: 1280px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
nav.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); display: flex; flex-direction: column; gap: 2px; }
nav.side .grp { margin: 14px 0 4px; }
nav.side a { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r); color: hsl(var(--fg)); text-decoration: none; font-size: .9rem; }
nav.side a:hover { background: hsl(var(--muted)); }
nav.side a[aria-current="page"] { background: hsl(var(--muted)); font-weight: 600; }
nav.side .id { font: 500 .75rem var(--f-mono); min-width: 1.8em; }
nav.side .cnt { margin-left: auto; font: .72rem var(--f-mono); color: hsl(var(--muted-fg)); }
nav.side .cnt.warn { color: hsl(var(--warn)); font-weight: 500; }
main { min-width: 0; display: flex; flex-direction: column; gap: 28px; }

/* domain color */
.dot { width: .6em; height: .6em; border-radius: 50%; display: inline-block; flex: none; background: hsl(var(--dc, var(--muted-fg))); align-self: center; }
[data-d="D1"] { --dc: var(--d1); } [data-d="D2"] { --dc: var(--d2); } [data-d="D3"] { --dc: var(--d3); } [data-d="D4"] { --dc: var(--d4); } [data-d="D5"] { --dc: var(--d5); }

/* status strip */
.status { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat { border: 1px solid hsl(var(--border)); border-left: 4px solid hsl(var(--sc, var(--border))); border-radius: var(--r); background: hsl(var(--card)); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; }
.stat b { font: 700 1.5rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat.warn { --sc: var(--warn); } .stat.bad { --sc: var(--bad); } .stat.ok { --sc: var(--ok); }
.callout { border: 1px solid hsl(var(--warn) / .5); background: hsl(var(--warn) / .08); border-radius: var(--r); padding: 12px 14px; font-size: .88rem; display: flex; flex-direction: column; gap: 6px; }
.callout summary { cursor: pointer; font-weight: 600; }

/* weights */
.weights { display: grid; gap: 10px; }
.wrow { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.wrow .nm { display: flex; gap: 8px; align-items: baseline; font-size: .88rem; min-width: 0; }
.wrow .nm a { color: inherit; text-decoration: none; }
.wrow .nm a:hover { text-decoration: underline; }
.bars { display: grid; gap: 3px; }
.b { display: flex; align-items: center; gap: 8px; font: .75rem var(--f-mono); }
.b i { display: block; height: 10px; border-radius: 2px; background: hsl(var(--dc)); }
.b.old i { background: transparent; border: 1px dashed hsl(var(--muted-fg)); height: 8px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .78rem; color: hsl(var(--muted-fg)); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 8px; margin-right: 6px; vertical-align: middle; border-radius: 2px; background: hsl(var(--fg)); }
.legend span.old::before { background: transparent; border: 1px dashed hsl(var(--muted-fg)); }

/* domain cards on overview */
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.dcard { border: 1px solid hsl(var(--border)); border-top: 3px solid hsl(var(--dc)); border-radius: var(--r); background: hsl(var(--card)); padding: 14px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; }
.dcard:hover { border-color: hsl(var(--dc)); }
.dcard .counts { display: flex; flex-wrap: wrap; gap: 4px 12px; font: .75rem var(--f-mono); color: hsl(var(--muted-fg)); }

/* sections + entries */
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid hsl(var(--border)); padding-bottom: 6px; }
.sec-h .n { font: .8rem var(--f-mono); color: hsl(var(--muted-fg)); }
.jump { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
.entries { display: flex; flex-direction: column; gap: 10px; }
.entry { border: 1px solid hsl(var(--border)); border-radius: var(--r); background: hsl(var(--card)); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.entry.conflict { border-left: 4px solid hsl(var(--warn)); }
.entry.unv { border-left: 4px solid hsl(var(--muted-fg)); }
.ehead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.ehead h3 { flex: 1 1 260px; min-width: 0; }
.kv { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 12px; font-size: .9rem; }
.kv dt { color: hsl(var(--muted-fg)); font-size: .8rem; padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.dist { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 2px; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: .82rem; min-width: 0; }
.link a { font-family: var(--f-mono); font-size: .78rem; overflow-wrap: anywhere; min-width: 0; }
.pill { font: 500 .68rem/1 var(--f-mono); letter-spacing: .03em; padding: 3px 6px; border-radius: 3px; white-space: nowrap; border: 1px solid transparent; }
.pill.v-yes { color: hsl(var(--ok)); border-color: hsl(var(--ok) / .6); background: hsl(var(--ok) / .1); }
.pill.v-no { color: hsl(var(--bad)); border-color: hsl(var(--bad) / .5); background: hsl(var(--bad) / .08); }
.pill.src { color: hsl(var(--muted-fg)); border-color: hsl(var(--border)); }
.pill.src.isaca { color: hsl(var(--primary)); border-color: hsl(var(--primary) / .6); }
.pill.basis { background: hsl(var(--muted)); color: hsl(var(--fg)); }
.pill.basis.gk { color: hsl(var(--warn)); background: hsl(var(--warn) / .1); }
.pill.kind { background: transparent; color: hsl(var(--muted-fg)); border-color: hsl(var(--border)); }
.pill.dom { color: hsl(var(--dc)); border-color: hsl(var(--dc) / .6); }
.pill.cand { color: hsl(var(--warn)); border-color: hsl(var(--warn) / .6); }
.pos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pos > div { border: 1px solid hsl(var(--border)); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; min-width: 0; }
.pos .isa { border-color: hsl(var(--primary) / .5); }
.res { border: 1px solid hsl(var(--ok) / .6); background: hsl(var(--ok) / .07); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; min-width: 0; }
.res.open { border-color: hsl(var(--warn) / .6); background: hsl(var(--warn) / .07); }
.res p { margin: 0; }
.tbl-wrap { overflow-x: auto; }
table.src { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.src td, table.src th { text-align: left; padding: 6px 8px; border-bottom: 1px solid hsl(var(--border)); vertical-align: top; }
table.src th { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: hsl(var(--muted-fg)); }
table.src td a { font-family: var(--f-mono); font-size: .76rem; overflow-wrap: anywhere; }
.empty { border: 1px dashed hsl(var(--border)); border-radius: var(--r); padding: 14px; color: hsl(var(--muted-fg)); font-size: .9rem; }
.dhead { display: flex; flex-direction: column; gap: 10px; border-left: 4px solid hsl(var(--dc)); padding-left: 14px; }
.dhead .w { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; }
.dhead .w b { font: 700 1.1rem var(--f-display); }
.summary { max-width: 70ch; }
.more { align-self: flex-start; font: inherit; font-size: .85rem; padding: 6px 12px; border: 1px solid hsl(var(--border)); border-radius: var(--r); background: hsl(var(--card)); color: hsl(var(--fg)); cursor: pointer; }
footer { font-size: .78rem; color: hsl(var(--muted-fg)); border-top: 1px solid hsl(var(--border)); padding-top: 12px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  nav.side { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.side .grp { display: none; }
  nav.side a { white-space: nowrap; border: 1px solid hsl(var(--border)); }
  nav.side a .lbl { display: none; }
  nav.side a .lbl.keep { display: inline; }
  .wrow { grid-template-columns: minmax(0, 1fr); }
  .pos { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv dt { padding-top: 6px; }
  .selects { flex-basis: 100%; flex-wrap: nowrap; }
  .selects select { flex: 1 1 0; min-width: 0; font-size: .78rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <span class="brand">CISA Wiki<small id="ver"></small></span>
    <input id="q" type="search" placeholder="Search terms, traps, incidents, URLs…" aria-label="Search the wiki" autocomplete="off">
    <div class="selects">
      <select id="f-basis" aria-label="Filter by basis"></select>
      <select id="f-src" aria-label="Filter by source type"></select>
      <select id="f-link" aria-label="Filter by link status"></select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by entry type"></div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Wiki sections"></nav>
  <main id="main"></main>
</div>

<script id="wiki-data" type="application/json">__WIKI_JSON__</script>
<script id="build-info" type="application/json">__BUILD_INFO__</script>
<script>
(() => {
const W = JSON.parse(document.getElementById('wiki-data').textContent);
const BUILD = JSON.parse(document.getElementById('build-info').textContent);
const DOMAINS = W.domains || [];
const DMAP = Object.fromEntries(DOMAINS.map(d => [d.id, d]));
const DIDS = DOMAINS.map(d => d.id);

const KINDS = {
  subtopic:   { label: 'Subtopics',            one: 'Subtopic' },
  trap:       { label: 'Exam traps',           one: 'Exam trap' },
  example:    { label: 'Real-world incidents', one: 'Incident' },
  booktip:    { label: 'Book exam tips',       one: 'Book tip' },
  essential:  { label: 'Book exam essentials', one: 'Exam essential' },
  question:   { label: 'Book review questions', one: 'Question' },
  resource:   { label: 'Resources',            one: 'Resource' },
  video:      { label: 'YouTube explainers',   one: 'Video' },
  source:     { label: 'Sources',              one: 'Source' },
  theme:      { label: 'Cross-domain themes',  one: 'Theme' },
  glossary:   { label: 'Glossary',             one: 'Term' },
  conflict:   { label: 'Source conflicts',     one: 'Conflict' },
  unverified: { label: 'Unverified items',     one: 'Unverified' },
};
const KIND_ORDER = Object.keys(KINDS);
const BASIS_LABEL = {
  sourced: 'sourced', general_knowledge: 'general knowledge',
  unverified_paraphrase: 'unverified paraphrase', isaca_glossary_snippet: 'ISACA glossary snippet',
  book: 'book (Sybex)',
};
const SRC_LABEL = { isaca: 'ISACA', 'standards body': 'standards body', vendor: 'vendor', community: 'community', media: 'media', youtube: 'YouTube', book: 'book' };

/* ---------- helpers ---------- */
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const URL_RE = /https?:\/\/[^\s;,"'<>]+/g;
const extractUrls = s => (typeof s === 'string' ? (s.match(URL_RE) || []).map(u => u.replace(/[.)\]]+$/, '')) : []);
const asList = v => Array.isArray(v) ? v : (v == null ? [] : [v]);
let TOKENS = [];
let TOKEN_RE = null;
function hl(s) {
  if (s == null) return '';
  s = String(s);
  if (!TOKEN_RE) return esc(s);
  return s.split(TOKEN_RE).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } }
function shortUrl(u) {
  try { const x = new URL(u); let p = x.pathname + x.search; if (p.length > 58) p = p.slice(0, 55) + '…'; return x.hostname.replace(/^www\./, '') + (p === '/' ? '' : p); } catch { return u; }
}

/* ---------- URL registry: one verified state per URL ---------- */
const URLS = new Map();
const US = ((W.meta || {}).link_check || {}).url_status || {};
const US_LABEL = { ok: 'verified', partial: 'partial', blocked: 'blocked', unreadable: 'unreadable', dead: 'dead' };
function noteUrl(u, info = {}) {
  if (!u || typeof u !== 'string') return;
  const cur = URLS.get(u) || { verified: false, tags: new Set() };
  if (info.verified === true || ['ok', 'partial'].includes((US[u] || {}).status)) cur.verified = true;
  if (info.tag) cur.tags.add(info.tag);
  URLS.set(u, cur);
}
function urlTag(u) {
  const r = URLS.get(u);
  if (r && r.tags.size) return [...r.tags][0];
  const h = hostOf(u);
  if (h.endsWith('isaca.org')) return 'isaca';
  if (h.endsWith('youtube.com') || h === 'youtu.be') return 'youtube';
  return null;
}

/* ---------- flatten the wiki into searchable entries ---------- */
const E = [];
function add(kind, domain, raw, urls, extra = {}) {
  urls = [...new Set(asList(urls).flatMap(u => extractUrls(u)))];
  urls.forEach(u => noteUrl(u));
  E.push({ kind, domain, raw, urls, text: JSON.stringify(raw).toLowerCase(), domains: domain ? [domain] : [], ...extra });
}
function mentionedDomains(...strs) {
  const out = new Set(), re = /\b(?:Domain\s*|D)([1-9])\b/g;
  strs.forEach(s => { if (typeof s === 'string') for (const m of s.matchAll(re)) if (DMAP['D' + m[1]]) out.add('D' + m[1]); });
  return [...out];
}
for (const d of DOMAINS) {
  (d.sources || []).forEach(s => noteUrl(s.url, { verified: s.verified, tag: s.tag }));
  (d.third_party_resources || []).forEach(r => noteUrl(r.url, { verified: r.verified, tag: r.source_type }));
  (d.real_world_examples || []).forEach(x => noteUrl(x.source_url, { verified: x.verified, tag: x.source_type }));
  (d.youtube_explainers || []).forEach(v => noteUrl(v.url, { verified: v.verified, tag: 'youtube' }));
}
for (const d of DOMAINS) {
  (d.subtopics || []).forEach(s => add('subtopic', d.id, s, s.source_urls));
  (d.exam_traps || []).forEach(t => add('trap', d.id, t, [t.source_url, ...asList(t.source_urls)]));
  (d.real_world_examples || []).forEach(x => add('example', d.id, x, [x.source_url, ...asList(x.additional_source_urls)]));
  (d.book_exam_tips || []).forEach(x => add('booktip', d.id, x, []));
  (d.book_exam_essentials || []).forEach(x => add('essential', d.id, x, []));
  (d.book_review_questions || []).forEach(x => add('question', d.id, x, []));
  (d.third_party_resources || []).forEach(r => add('resource', d.id, r, [r.url]));
  (d.youtube_explainers || []).forEach(v => add('video', d.id, v, [v.url]));
  (d.sources || []).forEach(s => add('source', d.id, s, [s.url]));
}
(W.cross_domain_themes || []).forEach(t => add('theme', null, t, [t.source_url, ...asList(t.additional_source_urls)], { domains: asList(t.domains).filter(x => DMAP[x]) }));
(W.glossary || []).forEach(g => add('glossary', DMAP[g.domain] ? g.domain : null, g, [g.source_url]));
(W.source_conflicts || []).forEach((c, i) => add('conflict', null, c, [c.isaca_source, c.third_party_source, ...asList((c.resolution || {}).deciding_source)], {
  idx: i, domains: mentionedDomains(c.topic, c.isaca_position, c.third_party_position, c.notes),
}));
(W.unverified_items || []).forEach(u => add('unverified', DMAP[u.domain] ? u.domain : null, u, [u.url]));

for (const e of E) {
  const st = new Set();
  if (e.raw.source_type) st.add(e.raw.source_type);
  if (e.raw.tag) st.add(e.raw.tag);
  e.urls.forEach(u => { const t = urlTag(u); if (t) st.add(t); });
  e.srcTypes = st;
  e.anyVerified = e.urls.some(u => URLS.get(u)?.verified);
  e.anyUnverified = e.urls.some(u => !URLS.get(u)?.verified);
}
const ALL_URLS = [...URLS.keys()];
const N_VERIFIED = ALL_URLS.filter(u => URLS.get(u).verified).length;

/* ---------- state ---------- */
const VIEWS = ['overview', ...DIDS, 'conflicts', 'themes', 'glossary', 'unverified'];
const VIEW_KIND = { conflicts: 'conflict', themes: 'theme', glossary: 'glossary', unverified: 'unverified' };
const S = { view: 'overview', q: '', kinds: new Set(), basis: '', src: '', link: '' };
let SHOW_ALL = new Set();

function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  S.view = VIEWS.includes(h) ? h : 'overview';
}

/* ---------- filtering ---------- */
function passesFilters(e, ignoreKind) {
  if (!ignoreKind && S.kinds.size && !S.kinds.has(e.kind)) return false;
  if (S.basis && e.raw.basis !== S.basis) return false;
  if (S.src && !e.srcTypes.has(S.src)) return false;
  if (S.link === 'verified' && !e.anyVerified) return false;
  if (S.link === 'unverified' && !e.anyUnverified) return false;
  if (S.link === 'nourl' && e.urls.length) return false;
  if (TOKENS.length && !TOKENS.every(t => e.text.includes(t))) return false;
  return true;
}
function inScope(e) {
  if (S.view === 'overview') return true;
  if (DMAP[S.view]) return e.domains.includes(S.view);
  return e.kind === VIEW_KIND[S.view];
}
const filtersActive = () => TOKENS.length || S.kinds.size || S.basis || S.src || S.link;

/* ---------- rendering pieces ---------- */
function linkRow(u) {
  const r = URLS.get(u) || { verified: false };
  const tag = urlTag(u);
  const s = US[u] || {};
  const tip = s.note ? ` title="${esc(s.note)}"` : '';
  const vp = s.status && s.status !== 'ok'
    ? `<span class="pill ${s.status === 'partial' ? 'v-yes' : 'v-no'}"${tip}>${US_LABEL[s.status] || s.status}</span>`
    : r.verified ? `<span class="pill v-yes"${tip || ' title="verified: true in the wiki JSON"'}>verified</span>`
    : '<span class="pill v-no" title="verified: false and no link-check record">unverified</span>';
  const tp = tag ? `<span class="pill src ${tag === 'isaca' ? 'isaca' : ''}" title="Source type">${esc(SRC_LABEL[tag] || tag)}</span>`
                 : '<span class="pill src" title="No source type recorded in the wiki JSON">type not recorded</span>';
  return `<div class="link">${vp}${tp}<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${TOKEN_RE ? hl(shortUrl(u)) : esc(shortUrl(u))}</a></div>`;
}
function links(urls, emptyText = 'No source URL in the wiki.') {
  if (!urls.length) return `<div class="link"><span class="pill src">no URL</span><span class="muted">${esc(emptyText)}</span></div>`;
  return `<div class="links">${urls.map(linkRow).join('')}</div>`;
}
function basisPill(b) {
  if (!b) return '';
  const cls = b === 'sourced' || b === 'isaca_glossary_snippet' ? '' : 'gk';
  return `<span class="pill basis ${cls}" title="basis: ${esc(b)}">${esc(BASIS_LABEL[b] || b)}</span>`;
}
function srcPill(t) { return t ? `<span class="pill src ${t === 'isaca' ? 'isaca' : ''}">${esc(SRC_LABEL[t] || t)}</span>` : ''; }
function domPills(e) {
  return e.domains.map(id => `<a class="pill dom" data-d="${id}" href="#${id}" title="${esc(DMAP[id].name)}">${id}</a>`).join('');
}
function kindPill(e, show) { return show ? `<span class="pill kind">${KINDS[e.kind].one}</span>` : ''; }
function lcRows(o) {
  return [['Flag', o.flag], ['Link check', o.link_check], ['Links removed', asList(o.dead_links).map(d => `${d.url} (${d.field}): ${d.note}`)]];
}
function bookCite(r) {
  if (!r) return '';
  return `<div class="link"><span class="pill src">book</span> <span class="muted mono" style="font-size:.8rem">${hl(typeof r === 'string' ? r : r.cite || [r.chapter, r.section].filter(Boolean).join(', '))}</span></div>`;
}
function bookRefs(list) {
  return asList(list).map(r => `${r.chapter.replace(/^Ch (\d+) .*/, 'Ch $1')} · ${r.section} (L${r.line})`);
}
function resBlock(r) {
  if (!r) return '';
  const ok = r.status === 'resolved';
  return `<div class="res ${ok ? '' : 'open'}"><span class="eyebrow">${ok ? 'Resolution: study this' : 'Unresolved: best current answer'}</span><p><b>${hl(r.answer_to_study)}</b></p><p class="muted">${hl(r.reason)}${r.checked ? ` (checked ${esc(r.checked)})` : ''}</p>${asList(r.deciding_source).length ? links(asList(r.deciding_source)) : '<div class="link"><span class="pill src">no deciding source</span></div>'}</div>`;
}
function kv(pairs) {
  const rows = pairs.filter(([, v]) => v != null && v !== '' && !(Array.isArray(v) && !v.length));
  if (!rows.length) return '';
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${Array.isArray(v) ? `<ul class="dist">${v.map(x => `<li>${hl(x)}</li>`).join('')}</ul>` : hl(v)}</dd>`).join('')}</dl>`;
}

const R = {
  subtopic: (e, ctx) => { const s = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${s.part ? `<span class="mono muted">${esc(s.part)}.</span> ` : ''}${hl(s.name)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${basisPill(s.basis)}</div>
    ${kv([['Definition', s.definition], ['Why the auditor cares', s.why_auditor_cares], ['Exam distinctions', asList(s.exam_distinctions)], ['Note', s.note], ['Name note', s.name_note], ['Book sections', bookRefs(s.book_refs)], ...lcRows(s)])}
    ${links(e.urls, 'No source URL. Written from general CISA body of knowledge.')}</article>`; },
  trap: (e, ctx) => { const t = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(t.confused_concepts)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${basisPill(t.basis)}</div>
    ${kv([['Rule', t.rule], ['Note', t.note], ...lcRows(t)])}${links(e.urls)}</article>`; },
  example: (e, ctx) => { const x = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(x.name)} <span class="muted mono" style="font-weight:400;font-size:.85em">${hl(x.date)}</span></h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${srcPill(x.source_type)}</div>
    ${kv([['What happened', x.what_happened], ['Control', x.control_failed_or_worked], ['Maps to', x.maps_to_subtopic], ['Note', x.note], ...lcRows(x)])}${links(e.urls)}</article>`; },
  resource: (e, ctx) => { const r = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(r.title)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${srcPill(r.source_type)}</div>
    ${kv([['Publisher', r.publisher], ['Type', r.type], ['Relevance', r.relevance], ['Note', r.note], ...lcRows(r)])}${links(e.urls)}</article>`; },
  video: (e, ctx) => { const v = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(v.title || v.title_as_seen || v.url)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}</div>
    ${kv(Object.entries(v).filter(([k]) => !['title', 'url', 'verified'].includes(k)).map(([k, val]) => [k.replace(/_/g, ' '), typeof val === 'object' ? JSON.stringify(val) : val]))}${links(e.urls)}</article>`; },
  theme: (e, ctx) => { const t = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(t.theme)}</h3>${kindPill(e, ctx.mixed)}${domPills(e)}${basisPill(t.basis)}</div>
    ${kv([['Description', t.description], ...lcRows(t)])}${links(e.urls)}</article>`; },
  glossary: (e, ctx) => { const g = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(g.term)}</h3>${kindPill(e, ctx.mixed)}${basisPill(g.basis)}</div>
    ${kv([['Definition', g.definition], ['Book definition', g.book_definition], ['Note', g.note], ...lcRows(g)])}${g.basis === 'book' && !e.urls.length ? '' : links(e.urls)}${bookCite(g.book_ref)}</article>`; },
  booktip: (e, ctx) => { const t = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(t.book_ref.section || 'Exam tip')}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${basisPill(t.basis)}</div>
    ${kv([['Tip', t.tip], ['Maps to', t.maps_to_subtopic]])}${bookCite(t.book_ref)}</article>`; },
  essential: (e, ctx) => { const t = e.raw; return `<article class="entry">
    <div class="ehead"><h3>${hl(t.title)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${basisPill(t.basis)}</div>
    ${kv([['Essential', t.text], ['Maps to', t.maps_to_subtopic]])}${bookCite(t.book_ref)}</article>`; },
  question: (e, ctx) => { const q = e.raw; const opts = Object.entries(q.options || {}); return `<article class="entry">
    <div class="ehead"><h3><span class="mono muted">${esc(q.set)}.</span> ${hl(q.question)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${basisPill(q.basis)}</div>
    ${opts.length ? `<ol class="dist" style="list-style:none;padding-left:0;margin:0">${opts.map(([k, v]) => `<li><b class="mono">${esc(k)}.</b> ${hl(v)}</li>`).join('')}</ol>` : ''}
    <details><summary class="muted" style="cursor:pointer">Answer${q.maps_to_subtopic ? ' · maps to ' + esc(q.maps_to_subtopic) : ''}</summary>${kv([['Answer', q.answer || 'not parsed'], ['Explanation', q.explanation], ['Answer source', q.answer_ref]])}</details>
    ${bookCite(q.book_ref)}</article>`; },
  conflict: (e, ctx) => { const c = e.raw; return `<article class="entry conflict" id="conflict-${e.idx}">
    <div class="ehead"><h3>${hl(c.topic)}</h3>${kindPill(e, ctx.mixed)}${domPills(e)}${c.resolution ? (c.resolution.status === 'resolved' ? '<span class="pill v-yes">resolved</span>' : '<span class="pill cand">unresolved</span>') : '<span class="pill cand">listed, not resolved</span>'}</div>
    <div class="pos">
      <div class="isa"><span class="eyebrow">ISACA position</span><p>${hl(c.isaca_position) || '<span class="muted">Not stated</span>'}</p>${links(extractUrls(c.isaca_source), 'No ISACA source URL.')}</div>
      <div><span class="eyebrow">Third-party position</span><p>${hl(c.third_party_position) || '<span class="muted">Not stated</span>'}</p>${c.third_party_book_ref ? asList(c.third_party_book_ref).map(bookCite).join('') : links(extractUrls(c.third_party_source), 'No third-party source URL.')}</div>
    </div>
    ${resBlock(c.resolution)}
    ${c.notes ? `<p class="muted" style="font-size:.88rem">${hl(c.notes)}</p>` : ''}${kv(lcRows(c))}</article>`; },
  unverified: (e, ctx) => { const u = e.raw; const isVid = !!u.video_id; return `<article class="entry unv">
    <div class="ehead"><h3>${hl(isVid ? (u.title_as_seen || u.item) : u.item)}</h3>${kindPill(e, ctx.mixed)}${ctx.showDom ? domPills(e) : ''}${isVid ? '<span class="pill cand">video candidate</span>' : ''}${u.status === 'resolved' ? '<span class="pill v-yes">resolved</span>' : ''}</div>
    ${kv([isVid ? ['Channel', u.channel] : ['', null], isVid ? ['Title (oEmbed)', u.title_confirmed] : ['', null], ['Reason', u.reason], ['Needed action', u.needed_action], ['Attempt', u.attempt]])}
    ${u.url ? links(e.urls) : ''}${bookCite(u.book_ref)}</article>`; },
};

function sourceTable(list) {
  return `<div class="tbl-wrap"><table class="src"><thead><tr><th>Status</th><th>Type</th><th>URL</th><th>Note</th></tr></thead><tbody>${list.map(e => {
    const u = e.raw.url, dead = asList(e.raw.dead_links)[0];
    const st = u ? linkRow(u).match(/<span class="pill [^"]*"[^>]*>[^<]*<\/span>/)[0] : '<span class="pill v-no">dead</span>';
    const cell = u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${hl(shortUrl(u))}</a>` : `<span class="muted" title="${esc(dead ? dead.note : '')}">${esc(dead ? shortUrl(dead.url) : 'removed')} (removed)</span>`;
    const note = [e.raw.note, e.raw.link_check, dead && dead.note].filter(Boolean).join(' · ');
    return `<tr><td>${st}</td><td>${srcPill(e.raw.tag) || '<span class="muted">—</span>'}</td>
      <td>${cell}</td><td>${hl(note)}</td></tr>`; }).join('')}</tbody></table></div>`;
}

const PAGE = 40;
function renderList(kind, list, ctx, key) {
  if (!list.length) return '';
  if (kind === 'source') return sourceTable(list);
  const all = SHOW_ALL.has(key) || list.length <= PAGE + 10;
  const shown = all ? list : list.slice(0, PAGE);
  return `<div class="entries">${shown.map(e => R[e.kind](e, ctx)).join('')}</div>${all ? '' : `<button class="more" data-more="${esc(key)}">Show all ${list.length}</button>`}`;
}
function groupSections(list, ctx, keyPrefix, kinds = KIND_ORDER) {
  const by = {}; list.forEach(e => (by[e.kind] = by[e.kind] || []).push(e));
  return kinds.filter(k => by[k]).map(k => `<section id="${keyPrefix}-${k}"><div class="sec-h"><h2>${KINDS[k].label}</h2><span class="n">${by[k].length}</span></div>${renderList(k, by[k], ctx, keyPrefix + k)}</section>`).join('');
}

/* ---------- views ---------- */
function weightsBlock() {
  const max = Math.max(30, ...DOMAINS.map(d => Math.max(d.weight_percent || 0, d.weight_2019_percent || 0)));
  return `<section><div class="sec-h"><h2>Domain weights</h2><span class="n">2024 job practice vs 2019</span></div>
    <div class="legend"><span>2024 (current, ISACA)</span><span class="old">2019 (superseded; still shown by some third-party guides)</span></div>
    <div class="weights">${DOMAINS.map(d => `<div class="wrow" data-d="${d.id}">
      <div class="nm"><span class="dot"></span><span class="mono">${d.id}</span><a href="#${d.id}">${esc(d.name)}</a></div>
      <div class="bars"><div class="b"><i style="width:${(d.weight_percent / max * 100).toFixed(1)}%"></i>${d.weight_percent}%</div>
      ${d.weight_2019_percent != null ? `<div class="b old"><i style="width:${(d.weight_2019_percent / max * 100).toFixed(1)}%"></i>${d.weight_2019_percent}%</div>` : ''}</div></div>`).join('')}</div></section>`;
}
function counts(id) {
  const c = {}; E.forEach(e => { if (e.domain === id) c[e.kind] = (c[e.kind] || 0) + 1; }); return c;
}
function viewOverview() {
  const m = W.meta || {}, x = m.exam || {};
  const nConf = (W.source_conflicts || []).length, nUnv = (W.unverified_items || []).length;
  const nRes = (W.source_conflicts || []).filter(c => (c.resolution || {}).status === 'resolved').length;
  return `<div class="dhead" style="--dc:var(--primary)">
      <span class="eyebrow">${esc(m.job_practice_version || '')}</span>
      <h1>CISA exam domains wiki</h1>
      <div class="w">${x.questions ? `<span><b>${x.questions}</b> questions</span>` : ''}${x.minutes ? `<span><b>${x.minutes}</b> min</span>` : ''}${x.score_scale ? `<span>scale <b>${esc(x.score_scale)}</b></span>` : ''}${x.pass_score ? `<span>pass <b>${x.pass_score}</b></span>` : ''}${x.pass_rate ? `<span class="muted">pass rate: ${esc(x.pass_rate)}</span>` : ''}</div>
    </div>
    <div class="status">
      <a class="stat ${N_VERIFIED === ALL_URLS.length ? 'ok' : 'bad'}" href="#unverified"><span class="eyebrow">Link check</span><b>${N_VERIFIED} / ${ALL_URLS.length}</b><span class="muted">distinct URLs verified</span></a>
      <a class="stat warn" href="#conflicts"><span class="eyebrow">Source conflicts</span><b>${nConf}</b><span class="muted">${nRes} resolved, ${nConf - nRes} unresolved</span></a>
      <a class="stat" href="#unverified"><span class="eyebrow">Unverified items</span><b>${nUnv}</b><span class="muted">follow-ups (some marked resolved)</span></a>
    </div>
    ${m.method ? `<details class="callout"><summary>How this wiki was researched (read before relying on it)</summary><p>${esc(m.method)}</p></details>` : ''}
    ${m.book_enrichment ? `<details class="callout"><summary>Sybex study guide content (third-party book, added ${esc(m.book_enrichment.date)})</summary><p>${esc(m.book_enrichment.method)}</p><p>${esc(m.book_enrichment.rules)}</p><p class="mono" style="font-size:.8rem">${esc(Object.entries(m.book_enrichment.counts || {}).map(([k, v]) => k.replace(/_/g, ' ') + ': ' + v).join(' · '))}</p></details>` : ''}
    ${weightsBlock()}
    <section><div class="sec-h"><h2>Domains</h2></div><div class="dgrid">${DOMAINS.map(d => { const c = counts(d.id); return `<a class="dcard" data-d="${d.id}" href="#${d.id}">
      <span class="eyebrow">${d.id} · ${d.weight_percent}%</span><h3 style="font-family:var(--f-display);font-size:1.05rem">${esc(d.name)}</h3>
      <div class="counts">${['subtopic', 'trap', 'example', 'resource', 'source', 'question'].map(k => `<span>${c[k] || 0} ${KINDS[k].label.toLowerCase()}</span>`).join('')}</div></a>`; }).join('')}</div></section>
    <section><div class="sec-h"><h2>Source conflicts</h2><span class="n">${nConf} listed, ${nRes} resolved</span></div>
      <p class="muted" style="font-size:.88rem">Where sources disagree, both positions are kept and each conflict shows its resolution with the deciding source. ISACA (isaca.org) decides exam facts; primary sources decide incident and standards facts.</p>
      <div class="jump">${(W.source_conflicts || []).map((c, i) => `<a href="#conflicts" data-conf="${i}">${esc(c.topic)}</a>`).join('')}</div></section>`;
}
function viewDomain(id) {
  const d = DMAP[id];
  const list = E.filter(e => inScope(e) && passesFilters(e));
  const conf = list.filter(e => e.kind === 'conflict');
  const rest = list.filter(e => e.kind !== 'conflict');
  const kindsHere = KIND_ORDER.filter(k => rest.some(e => e.kind === k));
  const noVideos = !(d.youtube_explainers || []).length;
  const ctx = { mixed: false, showDom: false };
  return `<div class="dhead" data-d="${id}">
      <span class="eyebrow">${id}</span><h1>${esc(d.name)}</h1>
      <div class="w"><span><b>${d.weight_percent}%</b> of exam (2024)</span>${d.weight_2019_percent != null ? `<span class="muted">2019 weight: ${d.weight_2019_percent}% (superseded)</span>` : ''}</div>
      ${d.summary ? `<p class="summary">${hl(d.summary)}</p>` : ''}
      <div class="jump">${conf.length ? `<a href="#${id}" data-jump="${id}-conflict">Conflicts (${conf.length})</a>` : ''}${kindsHere.map(k => `<a href="#${id}" data-jump="${id}-${k}">${KINDS[k].label} (${rest.filter(e => e.kind === k).length})</a>`).join('')}</div>
    </div>
    ${conf.length ? `<section id="${id}-conflict"><div class="sec-h"><h2>Source conflicts that mention ${id}</h2><span class="n">${conf.length}</span></div>${renderList('conflict', conf, ctx, id + 'conflict')}</section>` : ''}
    ${groupSections(rest, ctx, id)}
    ${noVideos && !filtersActive() ? `<section><div class="sec-h"><h2>YouTube explainers</h2><span class="n">0</span></div><div class="empty">No video is listed for this domain yet. Remaining candidates are under <a href="#unverified">Unverified items</a>.</div></section>` : ''}
    ${!list.length ? '<div class="empty">Nothing in this domain matches the current search and filters.</div>' : ''}`;
}
function viewKind(view) {
  const k = VIEW_KIND[view];
  let list = E.filter(e => inScope(e) && passesFilters(e, true));
  if (k === 'glossary') list = list.slice().sort((a, b) => a.raw.term.localeCompare(b.raw.term));
  const intro = {
    conflicts: 'Sources disagree on these points. Both positions stay listed; the green box gives the answer to study, the deciding source and the reason. ISACA (isaca.org) decides exam facts; primary sources (regulators, government reports, standards bodies, company releases) decide the rest. Amber boxes could not be decided from reachable sources.',
    themes: 'Themes that cut across domains.',
    glossary: 'Terms with definitions. Basis shows whether the text comes from an ISACA glossary snippet, an unverified paraphrase or the Sybex study guide (third-party book, cited by chapter and line). Book definitions are shown next to the wiki definition, not merged.',
    unverified: 'Follow-ups that still need a page to be opened and checked, including YouTube candidates that are not listed as explainers yet.',
  }[view];
  let body;
  if (k === 'unverified') {
    const groups = [[null, 'General'], ...DIDS.map(id => [id, id + ' · ' + DMAP[id].name])];
    body = groups.map(([id, label]) => { const g = list.filter(e => e.domain === id); return g.length ? `<section><div class="sec-h"><h2>${esc(label)}</h2><span class="n">${g.length}</span></div>${renderList('unverified', g, { mixed: false, showDom: false }, 'unv' + id)}</section>` : ''; }).join('');
  } else {
    body = renderList(k, list, { mixed: false, showDom: true }, view);
  }
  return `<div class="dhead" style="--dc:var(--${k === 'conflict' ? 'warn' : 'muted-fg'})"><span class="eyebrow">${list.length} entries</span><h1>${KINDS[k].label}</h1><p class="summary muted">${intro}</p></div>
    ${body || '<div class="empty">Nothing matches the current search and filters.</div>'}`;
}
function viewResults() {
  const list = E.filter(e => passesFilters(e));
  const ctx = { mixed: false, showDom: true };
  return `<div class="dhead" style="--dc:var(--primary)"><span class="eyebrow">Whole wiki</span><h1>${list.length} result${list.length === 1 ? '' : 's'}</h1>
    <p class="muted">${TOKENS.length ? `Matching “${esc(S.q)}”` : 'Filtered'} across all domains, themes, glossary, conflicts and unverified items. Pick a domain on the left to narrow it.</p></div>
    ${list.length ? groupSections(list, ctx, 'all') : '<div class="empty">No entries match. Try fewer words or clear a filter.</div>'}`;
}

/* ---------- chrome ---------- */
function renderNav() {
  const nConf = (W.source_conflicts || []).length;
  const scoped = v => E.filter(e => { const sv = S.view; S.view = v; const r = inScope(e) && passesFilters(e, !!VIEW_KIND[v]); S.view = sv; return r; }).length;
  const item = (v, id, label, cnt, cls = '', d = '') => `<a href="#${v}" ${d ? `data-d="${d}"` : ''} ${S.view === v ? 'aria-current="page"' : ''}>${id}<span class="lbl ${cls}">${esc(label)}</span><span class="cnt ${v === 'conflicts' ? 'warn' : ''}">${cnt}</span></a>`;
  document.getElementById('nav').innerHTML =
    item('overview', '', filtersActive() ? 'All results' : 'Overview', filtersActive() ? scoped('overview') : '', 'keep') +
    '<span class="eyebrow grp">Domains</span>' +
    DOMAINS.map(d => item(d.id, `<span class="dot"></span><span class="id">${d.id}</span>`, d.name, scoped(d.id), '', d.id)).join('') +
    '<span class="eyebrow grp">Across domains</span>' +
    item('conflicts', '', 'Source conflicts', filtersActive() ? scoped('conflicts') : nConf, 'keep') +
    item('themes', '', 'Cross-domain themes', scoped('themes'), 'keep') +
    item('glossary', '', 'Glossary', scoped('glossary'), 'keep') +
    item('unverified', '', 'Unverified items', scoped('unverified'), 'keep');
}
function renderChips() {
  const scopeList = E.filter(e => inScope(e) && passesFilters(e, true));
  const c = {}; scopeList.forEach(e => c[e.kind] = (c[e.kind] || 0) + 1);
  const kinds = KIND_ORDER.filter(k => c[k] || S.kinds.has(k));
  const el = document.getElementById('chips');
  if (VIEW_KIND[S.view]) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = kinds.map(k => `<button class="chip" data-kind="${k}" aria-pressed="${S.kinds.has(k)}">${KINDS[k].label}<span class="n">${c[k] || 0}</span></button>`).join('') +
    (filtersActive() ? '<button class="chip reset" data-reset="1">Clear filters</button>' : '');
}
function fillSelects() {
  const basis = [...new Set(E.map(e => e.raw.basis).filter(Boolean))];
  const src = [...new Set(E.flatMap(e => [...e.srcTypes]))];
  document.getElementById('f-basis').innerHTML = '<option value="">Any basis</option>' + basis.map(b => `<option value="${esc(b)}">${esc(BASIS_LABEL[b] || b)}</option>`).join('');
  document.getElementById('f-src').innerHTML = '<option value="">Any source type</option>' + src.map(s => `<option value="${esc(s)}">${esc(SRC_LABEL[s] || s)}</option>`).join('');
  document.getElementById('f-link').innerHTML = '<option value="">Any link status</option><option value="verified">Has a verified link</option><option value="unverified">Has an unverified link</option><option value="nourl">No URL</option>';
}
function render(keepScroll) {
  TOKENS = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  TOKEN_RE = TOKENS.length ? new RegExp('(' + TOKENS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a, b) => b.length - a.length).join('|') + ')', 'gi') : null;
  const main = document.getElementById('main');
  let html;
  if (DMAP[S.view]) html = viewDomain(S.view);
  else if (VIEW_KIND[S.view]) html = viewKind(S.view);
  else if (filtersActive()) html = viewResults();
  else html = viewOverview();
  const b = BUILD || {};
  html += `<footer>Built ${esc(b.built_at || '?')} from <span class="mono">${esc(b.source_name || 'wiki JSON')}</span> (wiki date ${esc((W.meta || {}).date || '?')}). Verified state comes from each record's <span class="mono">verified</span> field; a URL counts as verified once any record marks it true.</footer>`;
  main.innerHTML = html;
  renderNav(); renderChips();
  if (!keepScroll) window.scrollTo(0, 0);
}

/* ---------- events ---------- */
let qTimer;
document.getElementById('q').addEventListener('input', ev => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = ev.target.value.trim(); SHOW_ALL.clear(); render(true); }, 120); });
document.getElementById('f-basis').addEventListener('change', ev => { S.basis = ev.target.value; render(true); });
document.getElementById('f-src').addEventListener('change', ev => { S.src = ev.target.value; render(true); });
document.getElementById('f-link').addEventListener('change', ev => { S.link = ev.target.value; render(true); });
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-kind],[data-reset],[data-more],[data-jump],[data-conf]');
  if (!t) return;
  if (t.dataset.kind) { const k = t.dataset.kind; S.kinds.has(k) ? S.kinds.delete(k) : S.kinds.add(k); render(true); }
  else if (t.dataset.reset) {
    Object.assign(S, { q: '', basis: '', src: '', link: '' }); S.kinds.clear();
    ['q', 'f-basis', 'f-src', 'f-link'].forEach(id => document.getElementById(id).value = '');
    render(true);
  }
  else if (t.dataset.more) { SHOW_ALL.add(t.dataset.more); render(true); }
  else if (t.dataset.jump) { ev.preventDefault(); document.getElementById(t.dataset.jump)?.scrollIntoView({ block: 'start' }); window.scrollBy(0, -130); }
  else if (t.dataset.conf) {
    ev.preventDefault(); location.hash = 'conflicts';
    setTimeout(() => { const el = document.getElementById('conflict-' + t.dataset.conf); if (el) { el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -130); } }, 30);
  }
});
window.addEventListener('hashchange', () => { readHash(); SHOW_ALL.clear(); render(); });

document.getElementById('ver').textContent = (W.meta || {}).date || '';
fillSelects(); readHash(); render();
})();
</script>
